[package]
name = "open-english-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "open-englishの静的フロントエンド(index.html/style.css/app.js等)をRPoem(open-runo-poem-compat)で配信するローカルサーバー。file://やpython3 -m http.serverへの依存を解消し、auto-update.jsのfetch()が確実に動作するようにする。"

[dependencies]
open-runo-poem-compat = { path = "../../RPoem/crates/open-runo-poem-compat" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
# 自動アップデート機能(2026-08-11追加、ユーザー指示「起動時の自動
# メンテナンスで自動UPDATEの自動バージョンアップ機能も搭載して、
# 自動でGithubから最新版を見つけて古いのは自動でアンインストールして
# 最新版を自動インストールする機能を搭載して」)向け。GitHub Releases
# APIの問い合わせ+インストーラーアセットのダウンロードに使う
# (OpenSSL不要のrustls-tls、他リポジトリの既定方針と同じ)。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# 会話履歴・設定の永続化(2026-08-18追加、ユーザー指示「DATABASEは…
# 本格的なローカルデータベース化してから」への対応)。常時利用可能な
# ローカルコピーとしてSQLite(`bundled` featureで静的リンク、利用者の
# 環境にシステムSQLiteが入っているかに依存しない)を必須の基盤とし、
# `aruaru-db`(PostgreSQL、自身のDUAL_DATABASE_URL機能で自己修復する
# 冗長化構成を持つ)を設定されていればオプトインでミラー先として使う
# (`aruaru-llm`側`geo_content.rs`と同じ`tokio-postgres`直結パターン)。
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-postgres = "0.7"
# /v1/db/*のHTTPボディ処理(2026-08-18追加、ユーザー指摘「HTTPボディ処理は
# 対象外とはどういう事？」への対応)。過去のHANDOFFにあった「RS-JSONは
# 埋め込み/静的JSONファイル向けのみ」という整理は、Rust-JSON側の実際の
# API(`from_slice_strict<T: DeserializeOwned>`/`to_vec_strict<T: Serialize>`
# ——RPC/wire formatの型付き入出力を明示的に想定した関数)を踏まえると
# 過度に狭い解釈だったため撤回し、この新規HTTPエンドポイントでは実際に
# RS-JSONの厳密モード(`parse_strict`と同じRFC 8259検証)を経由させる。
rust-json = { path = "../../RS-JSON" }
bytes = "1.9"
http-body-util = "0.1"
hyper = { version = "1.10", features = ["full"] }
# AIプログラミング支援バックエンド(2026-08-20新設、ユーザー指示
# 「VPSへの自動読み書き・GitHubへの自動読み書き・ローカルドライブへの
# 常駐エージェント読み書きをサーバー側で実装」への対応)向け。
# VPS連携: 純RustのSSHクライアント(`russh`、非同期・tokio対応、
# libssh2/OpenSSLへのCバインディング〈ssh2クレート〉と違いvcpkg等の
# 追加ネイティブ依存が要らずクロスプラットフォームで扱いやすいため採用)。
# 鍵ファイルの読み込みには`russh-keys`を使う。
russh = "0.45"
russh-keys = "0.45"
async-trait = "0.1"
# GitHubのContents API(Base64エンコードされたファイル内容)を扱うため。
base64 = "0.22"
